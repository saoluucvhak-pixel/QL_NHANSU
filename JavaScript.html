/* =========================================================================
   SERVER BRIDGE — bọc google.script.run thành Promise cho async/await
   ========================================================================= */
function runServer(fnName, ...args){
  return new Promise((resolve, reject)=>{
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(err))
      [fnName](...args);
  });
}

/** Đọc 1 File từ input[type=file] thành base64 rồi gửi lên server để lưu vào Google Drive.
 *  Trả về {url, name, id} của file trên Drive. */
function uploadFileField(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = async (evt)=>{
      try{
        const base64 = String(evt.target.result).split(',')[1] || '';
        const result = await runServer('uploadAttachment', base64, file.name, file.type || 'application/octet-stream');
        resolve(result);
      }catch(e){ reject(e); }
    };
    reader.onerror = () => reject(new Error('Không đọc được file.'));
    reader.readAsDataURL(file);
  });
}

/* =========================================================================
   COMPUTED-FIELD HELPERS
   ========================================================================= */
function computeHieuLucDenGeneric(row, table){
  const cfg = TABLES[table];
  const codeField = cfg.versionCodeField;
  if(!codeField || !row[codeField] || !row.HieuLucTuNgay) return null;
  const candidates = (DATA[table]||[]).filter(r =>
    r._id!==row._id && r[codeField]===row[codeField] && r.HieuLucTuNgay && r.HieuLucTuNgay > row.HieuLucTuNgay
  );
  if(candidates.length===0) return null;
  return candidates.reduce((min,r)=> (min===null || r.HieuLucTuNgay < min) ? r.HieuLucTuNgay : min, null);
}
function computeMucDongToiDaBac(row){
  const den = Number(row.ThuNhapDen)||0;
  const tu = Number(row.ThuNhapTu)||0;
  if(den===0) return 0;
  const tyle = Number(row.TyLeDong)||0;
  return (den-tu)*tyle;
}

async function loadAll(){
  try{
    CONFIG_STATUS = await runServer('getConfigStatus');
    if(!CONFIG_STATUS.configured){
      LOADED = true; render(); return; // hiện màn hình khởi tạo liên kết
    }
    if(!CONFIG_STATUS.initialized){
      LOADED = true; render(); return; // hiện màn hình khởi tạo cấu trúc dữ liệu
    }
    CURRENT_USER = await runServer('getCurrentUserInfo');
    if(!CURRENT_USER.role){
      LOADED = true; render(); return; // chưa có quyền / bị khoá / chưa được cấp tài khoản
    }
    // getAllData và getPendingDrafts không phụ thuộc nhau — gọi song song thay vì nối tiếp để
    // bớt 1 vòng round-trip lên server, giúp lần tải đầu tiên của app nhanh hơn.
    const [allData] = await Promise.all([runServer('getAllData'), refreshPendingCount()]);
    DATA = allData;
    LOADED = true;
  }catch(e){
    LOAD_ERROR = (e && e.message) ? e.message : String(e);
    LOADED = true;
  }
  render();
}

async function refreshPendingCount(){
  try{
    PENDING_DRAFTS = await runServer('getPendingDrafts');
    PENDING_COUNT = Object.values(PENDING_DRAFTS).reduce((sum, rows) => sum + rows.length, 0);
  }catch(e){ /* im lặng bỏ qua — không chặn app nếu lỗi đếm nháp */ }
}

async function runInitialize(){
  INIT_LOADING = true; render();
  try{
    await runServer('initializeDataStructure');
    CONFIG_STATUS.initialized = true;
    DATA = await runServer('getAllData');
    INIT_LOADING = false;
    showToast('✅ Đã khởi tạo cấu trúc dữ liệu.');
  }catch(err){
    INIT_LOADING = false;
    showToast('⚠️ Lỗi khởi tạo: ' + (err.message||err));
  }
  render();
}

async function submitSetup(){
  const urls = {};
  let missing = false;
  SETUP_GROUPS.forEach(g=>{
    const cap = g.key.charAt(0).toUpperCase()+g.key.slice(1);
    const mainVal = (document.getElementById('setup-'+g.key)||{value:''}).value.trim();
    const draftVal = (document.getElementById('setup-draft'+cap)||{value:''}).value.trim();
    if(!mainVal || !draftVal) missing = true;
    urls[g.key+'Url'] = mainVal;
    urls['draft'+cap+'Url'] = draftVal;
  });
  if(missing){
    SETUP_ERROR = 'Vui lòng nhập đủ 8 link Google Sheet (4 nhóm × Sheet chính + Sheet Nháp).'; render(); return;
  }
  SETUP_ERROR = 'loading';
  render();
  try{
    await runServer('saveConfig', urls);
    SETUP_ERROR = null;
    CONFIG_STATUS = null;
    LOADED = false; render();
    await loadAll();
  }catch(err){
    SETUP_ERROR = (err && err.message) ? err.message : String(err);
    render();
  }
}

async function changeLinks(){
  if(!confirm('Đổi liên kết dữ liệu sẽ đưa app quay lại màn hình khởi tạo (dữ liệu trên các Sheet hiện tại KHÔNG bị xoá). Tiếp tục?')) return;
  try{
    await runServer('resetConfig');
    CONFIG_STATUS = null; DATA = {}; LOADED = false; nav = {view:'home'};
    render();
    await loadAll();
  }catch(err){ showToast('⚠️ Lỗi: ' + (err.message||err)); }
}

function rowsOf(table, parentId){
  const cfg = TABLES[table];
  const all = DATA[table] || [];
  if(!cfg.parent) return all;
  return all.filter(r => r._parentId === parentId);
}
function getRow(table, id){ return (DATA[table]||[]).find(r=>r._id===id); }
/** Với field kiểu multiselect: value là danh sách _id cách nhau dấu phẩy -> trả về nhãn nối bằng ", ". */
function refLabelsJoined(field, value){
  const ids = String(value||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(ids.length===0) return '';
  return ids.map(id=>{ const rr=getRow(field.refTable,id); return rr ? (rr[field.refLabel]||id) : id; }).join(', ');
}
function fieldDisplay(field, value){
  if(value===undefined || value===null || value==="") return "—";
  if(field.type==="datetime-local") return String(value).replace('T',' ');
  if(field.type==="yesno") return value===true||value==="true"||value==="Yes"||value==="TRUE" ? "Có" : "Không";
  if(field.type==="multiselect" && field.refTable){
    const s = refLabelsJoined(field, value);
    return s || "—";
  }
  if(field.type==="select" && field.refTable){
    const refRow = getRow(field.refTable, value);
    return refRow ? (refRow[field.refLabel] || value) : value;
  }
  if(field.percent){
    const n = Number(value);
    if(!isNaN(n)) return (n*100).toLocaleString('vi-VN',{maximumFractionDigits:2}) + '%';
  }
  if(field.money){
    const n = Number(value);
    if(!isNaN(n)) return n.toLocaleString('vi-VN') + ' đ';
  }
  return value;
}
function tagClass(value){
  const s = String(value||'').toLowerCase();
  if(s.includes('đang làm')||s.includes('đã duyệt')||s.includes('đã xử lý')||s==='thêm mới') return 'tag-green';
  if(s.includes('chờ')||s.includes('tạm hoãn')||s.includes('đang xử lý')||s==='sửa') return 'tag-amber';
  if(s.includes('nghỉ việc')||s.includes('từ chối')||s.includes('chưa xử lý')||s.includes('hủy')||s.includes('huỷ')) return 'tag-red';
  return 'tag-grey';
}
function esc(s){
  return String(s===undefined||s===null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
/** Bỏ dấu tiếng Việt + chuyển thường — dùng cho MỌI ô tìm kiếm trong app, để gõ không dấu
 *  (VD "binh") vẫn tìm ra tên có dấu (VD "Bình"). */
function stripDiacritics(s){
  return String(s===undefined||s===null?'':s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g,'d').replace(/Đ/g,'D')
    .toLowerCase();
}
function ancestorEmployeeId(table, row){
  let curTable = table, curRow = row;
  let guard = 0;
  while(TABLES[curTable].parent && TABLES[curTable].parent !== 'DM_NHANVIEN' && guard < 10){
    const parentTable = TABLES[curTable].parent;
    const parentRow = getRow(parentTable, curRow._parentId);
    if(!parentRow) return null;
    curRow = parentRow; curTable = parentTable; guard++;
  }
  return curRow._parentId;
}
function latestByDate(rows, dateField){
  if(!rows || rows.length===0) return null;
  return rows.slice().sort((a,b)=> (b[dateField]||'').localeCompare(a[dateField]||''))[0];
}
/** Giống getCurrentAssignment nhưng trả về ID (MaPB/MaCV) thay vì nhãn — dùng để LỌC theo phòng ban/chức vụ. */
function getCurrentAssignmentId(empId){
  const rows = rowsOf('CT_QUATRINHCONGTAC', empId);
  const latest = latestByDate(rows, 'TuNgay');
  if(latest) return {maPB: latest.MaPB||'', maCV: latest.MaCV||''};
  let best = null;
  rowsOf('CT_QUATRINHLAMVIEC', empId).forEach(h=>{
    rowsOf('CT_CHITIETHOPDONG', h._id).forEach(hd=>{
      if(!best || (hd.HieuLucTuNgay||'') > (best.HieuLucTuNgay||'')) best = hd;
    });
  });
  return {maPB: best?(best.MaPhongBan||''):'', maCV: best?(best.MaCV||''):''};
}
function getCurrentAssignment(empId){
  const rows = rowsOf('CT_QUATRINHCONGTAC', empId);
  const latest = latestByDate(rows, 'TuNgay');
  if(latest){
    const pb = getRow('DM_PHONGBAN', latest.MaPB);
    const cv = getRow('DM_CHUCVU', latest.MaCV);
    return {phongban: pb?pb.TenPB:'—', chucvu: cv?cv.TenCV:'—'};
  }
  // Dự phòng: nếu nhân viên chưa có dòng "điều chuyển phòng ban" nào (VD dữ liệu mới chỉ nạp qua
  // Chi tiết hợp đồng, chưa nhập CT_QUATRINHCONGTAC) — lấy phòng ban/chức vụ từ dòng Chi tiết hợp
  // đồng mới nhất (MaPhongBan/MaCV) của mọi hợp đồng của nhân viên này.
  let best = null;
  rowsOf('CT_QUATRINHLAMVIEC', empId).forEach(h=>{
    rowsOf('CT_CHITIETHOPDONG', h._id).forEach(hd=>{
      if(!best || (hd.HieuLucTuNgay||'') > (best.HieuLucTuNgay||'')) best = hd;

  });

  const pb2 = getRow('DM_PHONGBAN', best.MaPhongBan);
  const cv2 = getRow('DM_CHUCVU', best.MaCV);
  return {phongban: pb2?pb2.TenPB:'—', chucvu: cv2?cv2.TenCV:'—'};
}
function getCurrentSalaryScheme(empId){
  const hdlds = rowsOf('CT_QUATRINHLAMVIEC', empId);
  let best=null;
  hdlds.forEach(h=>{
    rowsOf('CT_CHITIETHOPDONG', h._id).forEach(hd=>{
      if(!best || (hd.HieuLucTuNgay||'') > (best.HieuLucTuNgay||'')) best = hd;
    });
  });
  if(!best) return '—';
  return refLabelsJoined({refTable:'DM_LUONG', refLabel:'HinhThucLuong'}, best.MaLuong) || '—';

function getEarliestNgayVaoLam(empId){
  const hdlds = rowsOf('CT_QUATRINHLAMVIEC', empId);
  if(hdlds.length===0) return null;
  return hdlds.slice().sort((a,b)=>(a.NgayVaoLam||'').localeCompare(b.NgayVaoLam||''))[0].NgayVaoLam;

/** Sinh Mã nhân viên tự động dạng "MãPB.MãCV.STT" — STT là số thứ tự kế tiếp trong đúng nhóm
 *  Phòng ban + Chức vụ đó (dò trong các MaNV hiện có cùng tiền tố). VD: PB "02.01" + CV "8"
 *  -> "02.01.8.001", "02.01.8.002"... */
function generateNextMaNV(phongBanCode, chucVuCode){
  const prefix = String(phongBanCode||'') + '.' + String(chucVuCode||'') + '.';
  let maxSeq = 0;
  (DATA.DM_NHANVIEN||[]).forEach(e=>{
    const code = String(e.MaNV||'');
    if(code.indexOf(prefix)===0){
      const n = parseInt(code.slice(prefix.length), 10);
      if(!isNaN(n) && n>maxSeq) maxSeq = n;
    }
  });
  return prefix + String(maxSeq+1).padStart(3,'0');
}

/** Sinh "Số HĐLĐ" tự động dạng "yyyymmdd_STT" — ngày = hôm nay, STT = số thứ tự hợp đồng kế tiếp
 *  ký trong CÙNG ngày hôm nay (đếm các Số HĐLĐ hiện có bắt đầu bằng đúng ngày đó). */
function generateNextSoHDLD(){
  const today = new Date();
  const ymd = today.getFullYear() + String(today.getMonth()+1).padStart(2,'0') + String(today.getDate()).padStart(2,'0');
  const prefix = ymd + '_';
  let maxSeq = 0;
  (DATA.CT_QUATRINHLAMVIEC||[]).forEach(r=>{
    const code = String(r.SoHDLD||'');
    if(code.indexOf(prefix)===0){
      const n = parseInt(code.slice(prefix.length), 10);
      if(!isNaN(n) && n>maxSeq) maxSeq = n;
    }
  });
  return prefix + String(maxSeq+1).padStart(3,'0');
}

/** Sinh "Mã công tác" gợi ý cho 1 dòng Chi tiết hợp đồng (phụ lục/điều khoản) mới — đây KHÔNG phải
 *  mã tra trong danh mục nào cả, chỉ là số hiệu tham chiếu riêng của từng phụ lục trong 1 hợp đồng,
 *  dạng "{Số HĐLĐ}-PL{STT}" — STT = số phụ lục kế tiếp trong CÙNG hợp đồng đó. Vẫn cho sửa tay nếu cần. */
function generateNextMaCongTac(hopDongId){
  const hdld = getRow('CT_QUATRINHLAMVIEC', hopDongId);
  const soHDLD = hdld ? hdld.SoHDLD : '';
  const count = (DATA.CT_CHITIETHOPDONG||[]).filter(r=>r._parentId===hopDongId).length;
  return (soHDLD ? soHDLD+'-' : '') + 'PL' + String(count+1).padStart(2,'0');
}

/** Thử chạm THẲNG vào (các) khung iframe cha chứa trang này và tự đặt chiều cao —
 *  không phụ thuộc việc ai đó có "nghe" sự kiện resize hay không. Chỉ hoạt động nếu
 *  trình duyệt cho phép truy cập same-origin tới khung cha (Apps Script có cấp quyền này). */
function selfResizeAncestorFrames(){
  const targetHeight = () => Math.max(
    document.documentElement ? document.documentElement.scrollHeight : 0,
    document.body ? document.body.scrollHeight : 0,
    window.innerHeight || 0,
    600
  );
  let win = window;
  let depth = 0;
  while (win && depth < 5) {
    try {
      if (win.frameElement) {
        const h = targetHeight();
        win.frameElement.style.height = h + 'px';
        win.frameElement.style.minHeight = '100%';
        win.frameElement.style.border = '0';
      }
    } catch (e) {
      break; // hết quyền truy cập (cross-origin thật sự) — dừng lại, không phải lỗi
    }
    if (!win.parent || win.parent === win) break;
    win = win.parent;
    depth++;
  }
}

/** Google Apps Script nhúng Web App trong iframe và tự đo chiều cao nội dung để phóng to khung —
 *  nhưng phép đo đó thường chạy ngay lúc trang vừa tải xong, TRƯỚC KHI dữ liệu thật (qua
 *  google.script.run) kịp render lên #app. Nên phải chủ động "nhắc" lại mỗi khi nội dung thực sự
 *  thay đổi, thay vì đoán một mốc thời gian cố định. */
let _nudgeResizeTimers = [];
function nudgeResize(){
  // render() gọi nudgeResize() ở CUỐI mỗi lần vẽ lại (kể cả khi gõ tìm kiếm, chuyển màn hình
  // liên tục) — nếu không hủy các lần "rung" (kick) còn đang chờ của lần gọi trước, mỗi thao
  // tác của người dùng sẽ cộng dồn thêm 7 lần reflow ép buộc + postMessage, khiến UI giật/chậm
  // hẳn dù dữ liệu đã tải xong từ lâu. Hủy timer cũ trước khi đặt lịch mới để chỉ giữ đúng 1
  // đợt "rung" tương ứng với lần render() gần nhất.
  _nudgeResizeTimers.forEach(id => clearTimeout(id));
  _nudgeResizeTimers = [];
  const kick = () => {
    void document.body.offsetHeight;
    selfResizeAncestorFrames();
    window.dispatchEvent(new Event('resize'));
    window.scrollBy(0, 1);
    window.scrollBy(0, -1);
    document.body.style.transform = 'translateZ(0)';
    requestAnimationFrame(()=>{ document.body.style.transform = ''; });
    if(window.parent && window.parent !== window){
      try{ window.parent.postMessage({type:'resize', height: document.body.scrollHeight}, '*'); }catch(e){}
    }
  };
  requestAnimationFrame(kick);
  _nudgeResizeTimers = [50, 150, 400, 900, 1800, 3000].map(ms => setTimeout(kick, ms));
}

/** Tách riêng phần HTML danh sách nhân viên (lọc theo searchTerm) để có thể cập nhật MỘT MÌNH
 *  nó khi gõ tìm kiếm, thay vì phải render() lại TOÀN BỘ app (sidebar+topbar+content+modal) mỗi
 *  ký tự gõ — đây là nguyên nhân chính khiến việc gõ tìm nhân viên bị giật/chậm. */
function renderEmpListHtml(){
  const employees = DATA.DM_NHANVIEN || [];
  const filteredEmp = searchTerm ? employees.filter(e => stripDiacritics(e.TenNhanVien).includes(stripDiacritics(searchTerm)) || stripDiacritics(e.MaNV).includes(stripDiacritics(searchTerm))) : employees;
  const empListHtml = filteredEmp.slice(0,200).map(e => `
    <div class="nav-item nav-emp-item ${nav.view==='employee' && nav.empId===e._id ? 'active':''}" data-action="go-employee" data-id="${e._id}">
      <span class="nav-dot"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(e.TenNhanVien||'(Chưa đặt tên)')}</span>
    </div>`).join('');
  return employees.length===0 ? `<div style="padding:8px 16px; font-size:12.5px; color:#8b98ab;">Chưa có nhân viên.</div>` : empListHtml;
}

function renderTopbar(){
  let crumbs = [{label:'Tổng quan', action:'go-home'}];
  let pageTitle = 'Nhân sự';
  let pageDesc = 'Quản lý hồ sơ nhân sự, hợp đồng lao động và danh mục lương/thuế — dữ liệu lưu trực tiếp trên Google Sheet.';

  if(nav.view==='danhmuc'){
    crumbs = [{label:'Danh mục', action:'go-home'}, {label:TABLES[nav.table].label, current:true}];
    pageTitle = TABLES[nav.table].label;
    pageDesc = TABLES[nav.table].desc;
  } else if(nav.view==='tncnbac'){
    const tncn = getRow('DM_TNCN', nav.tncnId);
    crumbs = [{label:'Danh mục', action:'go-home'}, {label:'Thuế TNCN', action:'go-danhmuc', table:'DM_TNCN'}, {label:'Bậc thuế', current:true}];
    pageTitle = 'Bậc thuế — ' + (tncn?tncn.NoiDung:'');
    pageDesc = tncn ? (tncn.GhiChu||'') : '';
  } else if(nav.view==='luongbs'){
    const luong = getRow('DM_LUONG', nav.luongId);
    crumbs = [{label:'Danh mục', action:'go-home'}, {label:'Hình thức lương', action:'go-danhmuc', table:'DM_LUONG'}, {label:'Chi tiết bổ sung', current:true}];
    pageTitle = 'Chi tiết bổ sung — ' + (luong?luong.HinhThucLuong:'');
    pageDesc = luong ? (luong.CachTinh||'') : '';
  } else if(nav.view==='reports'){
    crumbs = [{label:'Báo cáo', current:true}];
    pageTitle = 'Báo cáo';
    pageDesc = 'Tổng hợp số liệu toàn công ty: hợp đồng, nghỉ phép, vi phạm, sự kiện sắp tới.';
  } else if(nav.view==='pending'){
    crumbs = [{label:'Chờ duyệt', current:true}];
    pageTitle = 'Chờ duyệt';
    pageDesc = 'Mọi thêm/sửa/xóa (nhân sự & danh mục) đều nằm ở đây trước — chỉ vào bản chính sau khi được duyệt.';
  } else if(nav.view==='users'){
    crumbs = [{label:'Người dùng', current:true}];
    pageTitle = 'Người dùng & phân quyền';
    pageDesc = 'Quản lý tài khoản được phép đăng nhập và mức quyền của từng người.';
  } else if(nav.view==='guide'){
    crumbs = [{label:'Hướng dẫn sử dụng', current:true}];
    pageTitle = 'Hướng dẫn sử dụng';
    pageDesc = 'Tổng quan hệ thống, phân quyền, quy trình nháp - duyệt và cách xử lý các lỗi thường gặp.';
  } else if(nav.view==='nghiepvu'){
    crumbs = [{label:'Nghiệp vụ', current:true}];
    pageTitle = 'Nghiệp vụ';
    pageDesc = 'Lối tắt nhập nhanh Nghỉ việc / Nghỉ phép / Nghỉ ốm / Chuyển công tác — chọn nhân viên, hệ thống tự tìm đúng hợp đồng và ghi vào đúng bảng, không cần tự đi tìm menu.';
  } else if(nav.view==='employee' || nav.view==='hdld'){
    const emp = getRow('DM_NHANVIEN', nav.empId);
    crumbs = [{label:'Nhân sự', action:'go-home'}, {label: emp ? emp.TenNhanVien : '(Nhân viên)', action:'go-employee', id: nav.empId}];
    pageTitle = emp ? emp.TenNhanVien : 'Nhân viên';
    pageDesc = `Mã NV ${emp?emp.MaNV:''} · Hồ sơ nhân sự đầy đủ theo từng nhóm dữ liệu.`;
    if(nav.view==='hdld'){
      const hdld = getRow('CT_QUATRINHLAMVIEC', nav.hdldId);
      crumbs.push({label: hdld ? ('HĐLĐ '+(hdld.SoHDLD||'')) : '(Hợp đồng)', current:true});
      pageTitle = 'Hợp đồng ' + (hdld?hdld.SoHDLD:''); pageDesc = (hdld?hdld.HinhThucHDLD:'') + ' · Vào làm ' + (hdld?hdld.NgayVaoLam:'');
    }
  }

  const crumbHtml = crumbs.map((c,i)=>{
    const sep = i>0 ? '<span class="crumb-sep">/</span>' : '';
    if(c.current) return sep + `<span class="crumb current">${esc(c.label)}</span>`;
    return sep + `<span class="crumb" data-action="${c.action}" ${c.id?`data-id="${c.id}"`:''} ${c.table?`data-table="${c.table}"`:''}>${esc(c.label)}</span>`;
  }).join('');

  return `
    <div class="breadcrumb">${crumbHtml}</div>
    <div class="page-title">${esc(pageTitle)}</div>
    <div class="page-desc">${esc(pageDesc)}</div>
  `;
}

function renderContent(){
  if(nav.view==='home') return renderHome();
  if(nav.view==='danhmuc') return renderTableView(nav.table, null);
  if(nav.view==='tncnbac') return renderTncnBacView();
  if(nav.view==='luongbs') return renderLuongBsView();
  if(nav.view==='reports') return renderReports();
  if(nav.view==='pending') return renderPendingView();
  if(nav.view==='users') return renderUsersView();
  if(nav.view==='employee') return renderEmployeeView();
  if(nav.view==='hdld') return renderHdldView();
  if(nav.view==='guide') return renderGuide();
  if(nav.view==='nghiepvu') return renderNghiepVuView();
  return '';
}

            <button class="btn-link-text" data-action="edit-row" data-table="DM_NHANVIEN" data-id="${e._id}">Sửa</button>

/* ---------------- GENERIC FLAT / CHILD TABLE VIEW ---------------- */
function canEditTable(table){
  if(!CURRENT_USER) return false;
  if(table==='DM_CONG') return !!CURRENT_USER.canAdmin;
  return !!CURRENT_USER.canEdit;
}

function renderTableView(table, parentId){
  const cfg = TABLES[table];
  const rows = rowsOf(table, parentId);
  const cols = cfg.columns;
  const isDrill = !!cfg.drill;
  const canEditThis = canEditTable(table);

  let body;
  if(rows.length===0){
    body = `<div class="empty-state">
      <div class="icon">${cfg.icon}</div>
      <div class="msg">Chưa có dữ liệu ${cfg.label.toLowerCase()}.</div>
      ${canEditThis ? `<button class="btn btn-primary" data-action="add-row" data-table="${table}" ${parentId?`data-parentid="${parentId}"`:''}>➕ Thêm ${cfg.label.toLowerCase()}</button>` : `<div style="font-size:12.5px;color:var(--text-mute);">Bạn không có quyền thêm dữ liệu ở đây.</div>`}
    </div>`;
  } else {
    body = `<div class="table-wrap"><table>
      <thead><tr>
        ${cols.map(c=>`<th>${esc(fieldLabel(table,c))}</th>`).join('')}
        <th></th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            ${cols.map(c=>{
              const f = cfg.fields.find(x=>x.key===c);
              const rawVal = f.computed ? f.computeFn(r, table) : r[c];
              const val = fieldDisplay(f, rawVal);
              if(f.tag) return `<td><span class="tag ${tagClass(rawVal)}">${esc(val)}</span></td>`;
              if(f.type==='file') return `<td>${rawVal ? `<a href="${esc(rawVal)}" target="_blank" rel="noopener" class="btn-link-text">📎 Xem file</a>` : '—'}</td>`;
              return `<td>${esc(val)}</td>`;
            }).join('')}
            <td class="actions">
              ${isDrill ? `<button class="btn btn-sm btn-ghost" data-action="go-drill" data-table="${table}" data-id="${r._id}">Xem chi tiết →</button>` : ''}
              ${canEditThis ? `
              <button class="btn-link-text" data-action="edit-row" data-table="${table}" data-id="${r._id}">Sửa</button>
              &nbsp;·&nbsp;
              <button class="btn-danger-text" data-action="delete-row" data-table="${table}" data-id="${r._id}">Hủy</button>` : ''}
            </td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
  }

  const versionNote = cfg.hasVersioning ? `<div class="callout">💡 Khi bạn thêm 1 dòng mới với <b>mã trùng</b> mã đã có, dòng cũ sẽ <b>tự động</b> điền "Hiệu lực đến" = đúng "Hiệu lực từ" của dòng mới — không cần sửa tay.</div>` : '';

  return `${versionNote}<div class="panel">
    <div class="panel-head">
      <div>
        <div class="panel-title">${cfg.icon} ${cfg.label}</div>
        <div class="panel-desc">${esc(cfg.desc)}</div>
      </div>
      ${(rows.length>0 && !cfg.singleton && canEditThis) ? `<button class="btn btn-primary" data-action="add-row" data-table="${table}" ${parentId?`data-parentid="${parentId}"`:''}>➕ Thêm</button>` : ''}
    </div>
    ${body}
  </div>`;
}
function fieldLabel(table,key){
  const f = TABLES[table].fields.find(x=>x.key===key);
  return f ? f.label : key;
}

        <tbody>
          ${rows.map(r=>{
            const actionCls = r.HanhDong==='Thêm'?'tag-green':(r.HanhDong==='Xóa'?'tag-red':'tag-amber');

function openNghiepVuModal(action, empId){
  if(action==='nghiviec'){
    modalState = {table:'DM_NHANVIEN', row: getRow('DM_NHANVIEN', empId)};
  } else if(action==='chuyencongtac'){
    modalState = {table:'CT_QUATRINHCONGTAC', parentId: empId};
  } else if(action==='nghiphep' || action==='nghiom'){
    const contract = rowsOf('CT_QUATRINHLAMVIEC', empId).find(r=>!r.NgayChamDutHDLD);
    if(!contract){
      showToast('⚠️ Nhân viên này chưa có hợp đồng lao động đang hoạt động (chưa có ngày chấm dứt) — vào tab Hợp đồng lao động để thêm/kiểm tra hợp đồng trước.');
      return;
    }
    modalState = {table: action==='nghiphep' ? 'CT_NGHIPHEP' : 'CT_NGHIOM', parentId: contract._id};
  }
  nghiepVuState = {step:'pick-action'};
}

/** Tìm hợp đồng lao động ĐANG HIỆU LỰC của 1 nhân viên (chưa chấm dứt, hoặc mới nhất nếu
 *  nhiều hợp đồng đều đã chấm dứt) — dùng để tự gắn nghiệp vụ vào đúng chỗ. */
function getCurrentHdldForEmployee(empId){
  const rows = (DATA.CT_QUATRINHLAMVIEC||[]).filter(r=>r._parentId===empId);
  if(rows.length===0) return null;
  const today = fmt(new Date());
  const active = rows.filter(r=>!r.NgayChamDutHDLD || r.NgayChamDutHDLD>=today);
  const pool = active.length ? active : rows;
  return pool.slice().sort((a,b)=>(b.NgayVaoLam||'').localeCompare(a.NgayVaoLam||''))[0];
}

function renderReports(){
  const tab = nav.reportTab || 'expiring';
  const tabsHtml = REPORT_TABS.map(t=>`
    <div class="report-tab-btn ${tab===t.key?'active':''}" data-action="set-report-tab" data-tab="${t.key}">${t.label}</div>
  `).join('');
  let body = '';
  if(tab==='expiring') body = renderReportExpiring();
  else if(tab==='headcount') body = renderReportHeadcount();
  else if(tab==='employee-history') body = renderReportEmployeeHistory();
  else if(tab==='leave') body = renderReportLeave();
  else if(tab==='violations') body = renderReportViolations();
  else if(tab==='upcoming') body = renderReportUpcoming();
  else if(tab==='export') body = renderReportExport();
  return `<div class="report-tabbar">${tabsHtml}</div>${body}`;
}

function computeExpiringContracts(){
  const today = new Date(); today.setHours(0,0,0,0);
  const rows = (DATA.CT_QUATRINHLAMVIEC||[]).filter(r=>r.NgayChamDutHDLD);
  const out = rows.map(r=>{
    const end = new Date(r.NgayChamDutHDLD+'T00:00:00');
    const diffDays = Math.round((end-today)/86400000);
    return {row:r, diffDays, emp:getRow('DM_NHANVIEN', r._parentId)};
  }).filter(x=>x.diffDays<=90);
  out.sort((a,b)=>a.diffDays-b.diffDays);
  return out;
}
function renderReportExpiring(){
  const list = computeExpiringContracts();
  if(list.length===0){
    return `<div class="panel"><div class="empty-state"><div class="icon">✅</div><div class="msg">Không có hợp đồng nào sắp hết hạn trong 90 ngày tới.</div></div></div>`;
  }
  return `<div class="panel">
    <div class="panel-head">
      <div><div class="panel-title">⏰ Hợp đồng sắp hết hạn / đã hết hạn</div><div class="panel-desc">Trong vòng 90 ngày tới, sắp xếp theo thời gian còn lại.</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nhân viên</th><th>Số HĐLĐ</th><th>Ngày chấm dứt</th><th>Trạng thái</th></tr></thead>
      <tbody>
        ${list.map(x=>{
          let label, cls;
          if(x.diffDays<0){ label = `Đã hết hạn ${Math.abs(x.diffDays)} ngày trước`; cls='tag-red'; }
          else if(x.diffDays===0){ label = 'Hết hạn hôm nay'; cls='tag-red'; }
          else if(x.diffDays<=30){ label = `Còn ${x.diffDays} ngày`; cls='tag-amber'; }
          else { label = `Còn ${x.diffDays} ngày`; cls='tag-grey'; }
          return `<tr style="cursor:pointer;" data-action="go-hdld" data-empid="${x.row._parentId}" data-id="${x.row._id}">

}

function fmtTodayIso(){ return new Date().toISOString().slice(0,10); }
function defaultYearStartIso(){ return new Date().getFullYear()+'-01-01'; }

function computeHeadcountReport(tuNgay, denNgay){
  const hdlds = DATA.CT_QUATRINHLAMVIEC||[];
  const byEmp = {};
  hdlds.forEach(h=>{
    const empId = h._parentId;
    if(!byEmp[empId]) byEmp[empId] = { vaoSom: h.NgayVaoLam||'', nghiTre: h.NgayChamDutHDLD||'' };
    else{
      if(h.NgayVaoLam && (!byEmp[empId].vaoSom || h.NgayVaoLam < byEmp[empId].vaoSom)) byEmp[empId].vaoSom = h.NgayVaoLam;
      if(h.NgayChamDutHDLD && (!byEmp[empId].nghiTre || h.NgayChamDutHDLD > byEmp[empId].nghiTre)) byEmp[empId].nghiTre = h.NgayChamDutHDLD;
    }
  });
  const out = [];
  (DATA.DM_NHANVIEN||[]).forEach(emp=>{
    const info = byEmp[emp._id];
    const vaoLam = info ? info.vaoSom : (emp.NgayVaoHeThong||'');
    const nghiViec = info ? info.nghiTre : '';
    const activeInRange = (!denNgay || !vaoLam || vaoLam<=denNgay) && (!nghiViec || !tuNgay || nghiViec>=tuNgay);
    if(!activeInRange) return;
    const asg = getCurrentAssignment(emp._id);
    const tuyenMoiTrongKy = !!(vaoLam && tuNgay && denNgay && vaoLam>=tuNgay && vaoLam<=denNgay);
    const nghiTrongKy = !!(nghiViec && tuNgay && denNgay && nghiViec>=tuNgay && nghiViec<=denNgay);
    out.push({emp, vaoLam, nghiViec, phongban:asg.phongban, chucvu:asg.chucvu, tuyenMoiTrongKy, nghiTrongKy});
  });
  out.sort((a,b)=>(a.emp.TenNhanVien||'').localeCompare(b.emp.TenNhanVien||''));
  return out;
}

/** Tóm tắt ngắn gọn nội dung 1 dòng lịch sử, dùng luôn cấu hình cột (columns) + fieldDisplay của bảng đó. */
function summarizeHistoryRow(table, row){
  const cfg = TABLES[table];
  if(!cfg) return '';
  const cols = (cfg.columns||[]).filter(c=>c!=='TrangThaiBanGhi' && c!=='HieuLucTuNgay');
  return cols.map(c=>{
    const f = (cfg.fields||[]).find(x=>x.key===c);
    if(!f) return null;
    const raw = f.computed ? (f.computeFn ? f.computeFn(row, table) : row[c]) : row[c];
    const val = fieldDisplay(f, raw);
    return (val && val!=='—') ? `${f.label}: ${val}` : null;
  }).filter(Boolean).join(' · ');
}

function computeMonthlyLeave(){
  const year = new Date().getFullYear();
  const months = Array(12).fill(0);
  const addRows = (arrName, dateField) => {
    (DATA[arrName]||[]).forEach(r=>{
      if(r.TrangThaiDuyet && r.TrangThaiDuyet!=='Đã duyệt') return;
      if(!r[dateField]) return;
      const d = new Date(r[dateField]+'T00:00:00');
      if(isNaN(d) || d.getFullYear()!==year) return;
      months[d.getMonth()] += Number(r.SoNgayNghi)||0;
    });
  };
  addRows('CT_NGHIPHEP','TuNgay');
  addRows('CT_NGHIOM','TuNgay');
  return months;
}
function computeLeaveByEmployee(){
  const map = {};
  const addRows = (arrName) => {
    (DATA[arrName]||[]).forEach(r=>{
      if(r.TrangThaiDuyet && r.TrangThaiDuyet!=='Đã duyệt') return;
      const empId = ancestorEmployeeId(arrName, r);
      if(!empId) return;
      map[empId] = (map[empId]||0) + (Number(r.SoNgayNghi)||0);
    });
  };
  addRows('CT_NGHIPHEP');
  addRows('CT_NGHIOM');
  return map;
}

function computeUpcomingBirthdays(){
  const today = new Date(); today.setHours(0,0,0,0);
  const seen = new Set(); const out = [];
  (DATA.CT_THONGTINCANHAN||[]).forEach(r=>{
    if(!r.NgaySinh || seen.has(r._parentId)) return;
    seen.add(r._parentId);
    const bd = new Date(r.NgaySinh+'T00:00:00');
    if(isNaN(bd)) return;
    let next = new Date(today.getFullYear(), bd.getMonth(), bd.getDate());
    if(next<today) next.setFullYear(today.getFullYear()+1);
    const diffDays = Math.round((next-today)/86400000);
    if(diffDays<=30) out.push({empId:r._parentId, emp:getRow('DM_NHANVIEN',r._parentId), date:next, diffDays, type:'birthday'});
  });
  return out;
}
function computeUpcomingRenewals(){
  return computeExpiringContracts().filter(x=>x.diffDays>=0 && x.diffDays<=30)

}

      <td style="font-weight:700;">${TABLES[t].icon} ${esc(TABLES[t].label)}</td>
      <td><span class="pk-badge">${t}</span></td>
      <td>${(DATA[t]||[]).length}</td>
      <td class="actions"><button class="btn btn-sm btn-ghost" data-action="export-csv" data-table="${t}">⬇ CSV</button></td>
    </tr>`).join('');
  return `
  <div class="panel" style="margin-bottom:18px;">
    <div class="panel-head">
      <div><div class="panel-title">📥 Xuất toàn bộ dữ liệu</div><div class="panel-desc">Xuất tất cả bảng thành 1 file Excel (.xlsx), mỗi bảng 1 sheet.</div></div>
      <button class="btn btn-primary" data-action="export-excel-all">📥 Xuất Excel toàn bộ</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><div><div class="panel-title">Xuất theo từng bảng (CSV)</div><div class="panel-desc">Dùng khi chỉ cần 1 bảng cụ thể. (Bạn cũng có thể mở trực tiếp Google Sheet để xem/sửa dữ liệu thô.)</div></div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Bảng</th><th>Mã</th><th>Số dòng</th><th></th></tr></thead>
      <tbody>${rowsList}</tbody>
    </table></div>
  </div>`;
}
function toCSV(table){
  const cfg = TABLES[table];
  const rows = DATA[table]||[];
  const headers = cfg.fields.map(f=>f.label);
  const lines = [headers.join(',')];
  rows.forEach(r=>{
    const vals = cfg.fields.map(f=>{
      let v = f.computed ? f.computeFn(r, table) : r[f.key];
      if(f.type==='multiselect' && f.refTable){ v = refLabelsJoined(f, v); }
      else if(f.type==='select' && f.refTable){ const rr=getRow(f.refTable,v); v = rr?(rr[f.refLabel]||v):v; }
      if(f.type==='yesno') v = v?'Có':'Không';
      v = (v===undefined||v===null)?'':String(v);
      if(v.includes(',')||v.includes('"')||v.includes('\n')){ v = '"'+v.replace(/"/g,'""')+'"'; }
      return v;
    });
    lines.push(vals.join(','));
  });
  return lines.join('\n');
}
function downloadCSV(table){
  const csv = toCSV(table);
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = table+'.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportToExcel(){
  if(typeof XLSX === 'undefined'){ showToast('⚠️ Thư viện xuất Excel chưa tải xong, thử lại sau.'); return; }
  const wb = XLSX.utils.book_new();
  Object.keys(TABLES).forEach(t=>{
    const cfg = TABLES[t];
    const rows = DATA[t]||[];
    const data = rows.map(r=>{
      const obj = {};
      cfg.fields.forEach(f=>{
        let v = f.computed ? f.computeFn(r, t) : r[f.key];
        if(f.type==='multiselect' && f.refTable){ v = refLabelsJoined(f, v); }
        else if(f.type==='select' && f.refTable){ const rr=getRow(f.refTable,v); v = rr?(rr[f.refLabel]||v):v; }
        if(f.type==='yesno') v = v?'Có':'Không';
        obj[f.label] = v===undefined?'':v;
      });
      return obj;
    });
    const ws = data.length ? XLSX.utils.json_to_sheet(data) : XLSX.utils.aoa_to_sheet([cfg.fields.map(f=>f.label)]);
    XLSX.utils.book_append_sheet(wb, ws, t.substring(0,31));
  });
  XLSX.writeFile(wb, 'QuanLyNhanSu_Export_' + fmt(new Date()) + '.xlsx');
}

/* =========================================================================
   TẢI DỮ LIỆU BAN ĐẦU — file mẫu + nạp hàng loạt (chỉ danh mục gốc + DM_NHANVIEN,
   không gồm các bảng con CT_* vì cần biết đúng ID nhân viên/hợp đồng cha — nhập
   những bảng đó qua giao diện bình thường sẽ an toàn hơn).
   ========================================================================= */
// Nhập được cả danh mục gốc VÀ hồ sơ nhân sự (2 cấp): bảng con trực tiếp của Nhân viên ghép nối qua
// cột "MaNV" (mã nhân viên), bảng con của Hợp đồng lao động ghép nối qua cột "SoHDLD" — không cần biết
// ID nội bộ, hệ thống tự tra cứu đúng dòng cha khi nạp.
const IMPORTABLE_TABLES = Object.keys(TABLES).filter(t => {
  const cfg = TABLES[t];
  if (t==='DM_CONG' || t==='DM_NGUOIDUNG') return false;
  if (!cfg.parent) return true;                 // danh mục gốc + DM_NHANVIEN
  if (cfg.level==='employee') return true;       // con trực tiếp của Nhân viên (ghép qua MaNV)
  if (cfg.level==='hdld') return true;           // con của Hợp đồng lao động (ghép qua SoHDLD)
  return false;
});

// Ánh xạ refTable -> tên cột "Mã" tự nhiên (mã người dùng đã quen dùng) để nhập liệu ban đầu
// KHÔNG cần biết ID nội bộ do Google sinh ra — hệ thống tự tra cứu đúng ID khi nạp.
const REF_CODE_FIELD = {
  DM_PHONGBAN:'MaPB', DM_CHUCVU:'MaCV', DM_LUONG:'MaLuong', DM_PHUCAP:'MaPhuCap',
  DM_TANGCA:'MaTangCa', DM_HOTRO:'MaHoTro', DM_BAOHIEM:'MaBaoHiem', DM_TNCN:'MaThueTNCN',
  DM_GT_TNCN:'MaGiamTru', DM_CC:'MaCC',
};

/** Tìm _id thật ứng với 1 "mã" người dùng gõ vào file Excel (so khớp cột mã tự nhiên, VD
 *  MaPB/MaCV/MaLuong..., không phân biệt hoa/thường/khoảng trắng thừa). Ưu tiên tra trong dữ liệu
 *  vừa đọc CÙNG đợt import (freshRowsByTable, VD vừa nhập cả DM_PHONGBAN lẫn CT_QUATRINHCONGTAC
 *  trong 1 file), sau đó mới tới dữ liệu hiện có trong app. Vẫn chấp nhận nếu ai đó lỡ dán thẳng ID. */
function resolveRefCode(refTable, code, freshRowsByTable){
  if(code===undefined || code===null || code==='') return '';
  const codeField = REF_CODE_FIELD[refTable];
  const needle = String(code).trim().toLowerCase();
  const fresh = (freshRowsByTable && freshRowsByTable[refTable]) || [];
  const pool = fresh.concat(DATA[refTable]||[]);
  const hit = (codeField && pool.find(r => String(r[codeField]||'').trim().toLowerCase()===needle))
    || pool.find(r => String(r._id||'')===String(code));
  return hit ? hit._id : '';
}

/** Áp dụng resolveRefCode cho MỌI field kiểu select/multiselect có refTable trong 1 dòng dữ liệu
 *  vừa đọc từ Excel — biến giá trị người dùng gõ (mã dễ hiểu, multiselect cách nhau dấu phẩy)
 *  thành đúng _id nội bộ mà hệ thống cần lưu. */
function resolveRefFieldsInRow(cfg, row, freshRowsByTable){
  (cfg.fields||[]).forEach(f=>{
    if(!f.refTable) return;
    if(f.type==='multiselect'){
      const codes = String(row[f.key]||'').split(',').map(s=>s.trim()).filter(Boolean);
      row[f.key] = codes.map(c=>resolveRefCode(f.refTable, c, freshRowsByTable)).filter(Boolean).join(',');
    } else if(f.type==='select'){
      row[f.key] = resolveRefCode(f.refTable, row[f.key], freshRowsByTable);
    }
  });
}

/** Excel/Sheets có thể tự hiểu "0912345678" là số và rụng mất số 0 đầu. Với các cột có độ dài
 *  chuẩn cố định (SĐT Việt Nam = 10 số, CCCD = 12 số), nếu phát hiện thiếu ĐÚNG 1 chữ số và toàn
 *  bộ là số, tự bù lại số 0 ở đầu. Không đụng vào các giá trị đã đúng độ dài (VD CMND cũ 9 số). */
const FIXED_LENGTH_TEXT_FIELDS = { SoDienThoai: 10, SoCCCD: 12, SoCCCDNhanThan: 12 };
function fixLeadingZeroInRow(row){
  Object.keys(FIXED_LENGTH_TEXT_FIELDS).forEach(key=>{
    if(row[key]===undefined || row[key]===null || row[key]==='') return;
    const raw = String(row[key]).trim();
    const expectLen = FIXED_LENGTH_TEXT_FIELDS[key];
    if(/^\d+$/.test(raw) && raw.length === expectLen - 1){
      row[key] = '0' + raw;
    } else {
      row[key] = raw; // vẫn ép về chuỗi để tránh ký hiệu khoa học/mất định dạng khi có số quá dài
    }
  });
  return row;
}

/** Chuyển 1 giá trị Date (SheetJS trả về khi cellDates:true) thành chuỗi "yyyy-MM-dd" theo giờ
 *  ĐỊA PHƯƠNG (không dùng toISOString() vì nó quy theo giờ UTC, dễ bị lệch lùi 1 ngày). */
function dateToIsoLocal(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
/** Excel thường tự nhận diện ô ngày tháng và lưu dưới dạng số serial nội bộ — nếu đọc file mà
 *  không xử lý, các cột "Ngày..."/"Hiệu lực từ/đến"... sẽ hiện ra là 1 con số (VD 46237) thay vì
 *  ngày thật. Hàm này chuyển đúng các field kiểu "date" (theo cấu hình field của bảng) từ đối
 *  tượng Date (đã bật cellDates khi đọc file) về chuỗi yyyy-MM-dd mà hệ thống đang dùng thống nhất. */
function normalizeDateFieldsInRow(cfg, row){
  (cfg.fields||[]).forEach(f=>{
    if(f.type!=='date') return;
    const v = row[f.key];
    if(v instanceof Date && !isNaN(v)) row[f.key] = dateToIsoLocal(v);
  });
  return row;
}

function handleImportFileSelected(){
  const input = document.getElementById('import-file-input');
  if(!input.files || !input.files[0]) return;
  if(typeof XLSX === 'undefined'){ IMPORT_STATE.error = 'Thư viện Excel chưa tải xong, thử lại sau.'; render(); return; }
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const dataByTable = {};
      let totalRows = 0;
      wb.SheetNames.forEach(name=>{
        if(IMPORTABLE_TABLES.indexOf(name)===-1) return;
        const cfg = TABLES[name];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''});
        const clean = rows.filter(r => Object.values(r).some(v => v!==''));
        clean.forEach(r=>{ fixLeadingZeroInRow(r); normalizeDateFieldsInRow(cfg, r); });
        if(clean.length){ dataByTable[name] = clean; totalRows += clean.length; }
      });
      IMPORT_STATE.parsedData = dataByTable;
      let preview = totalRows>0
        ? `Đọc được ${totalRows} dòng từ ${Object.keys(dataByTable).length} bảng: ${Object.keys(dataByTable).join(', ')}.`
        : 'Không tìm thấy dữ liệu hợp lệ — kiểm tra tên sheet trong file có khớp đúng tên bảng không (VD: DM_CHUCVU, DM_NHANVIEN...).';
      if(dataByTable.CT_CHITIETHOPDONG && dataByTable.CT_CHITIETHOPDONG.length>0){
        const coHopDongTrongFile = dataByTable.CT_QUATRINHLAMVIEC && dataByTable.CT_QUATRINHLAMVIEC.length>0;
        const coHopDongSanCo = (DATA.CT_QUATRINHLAMVIEC||[]).length>0;
        if(!coHopDongTrongFile && !coHopDongSanCo){
          preview += ' ⚠️ Có dữ liệu CT_CHITIETHOPDONG nhưng chưa thấy hợp đồng nào (sheet CT_QUATRINHLAMVIEC trống và hệ thống cũng chưa có hợp đồng nào) — các dòng này sẽ bị bỏ qua khi nạp.';
        }
      }
      IMPORT_STATE.preview = preview;
      IMPORT_STATE.error = null;
    }catch(e){
      IMPORT_STATE.error = 'Không đọc được file: ' + (e.message||e);
      IMPORT_STATE.parsedData = null;
    }
    render();
  };
  reader.readAsArrayBuffer(file);
}

function normKey(v){ return String(v===undefined||v===null?'':v).trim().toLowerCase(); }

/** Ghép nối 2 cấp con (nhân viên -> hợp đồng -> bảng con của hợp đồng) bằng mã tự nhiên
 *  (MaNV, SoHDLD) thành đúng _id/_parentId nội bộ, để server chỉ việc ghi thẳng vào Sheet.
 *  QUAN TRỌNG: tra cứu MaNV/SoHDLD cả trong dữ liệu VỪA đọc từ file NÀY lẫn dữ liệu ĐÃ CÓ SẴN
 *  trong hệ thống (DATA) — vì nhân viên/hợp đồng có thể đã được tạo từ trước qua giao diện, không
 *  nhất thiết phải liệt kê lại trong file đang tải. Trả về cả out (dữ liệu đã ghép) và issues
 *  (danh sách dòng bị bỏ qua kèm lý do, để báo cho người dùng thay vì âm thầm loại bỏ). */
function resolveImportHierarchy(dataByTable){
  const out = {};
  const issues = [];
  const empIdMap = {};   // MaNV (đã chuẩn hoá) -> _id
  const hdldIdMap = {};  // SoHDLD (đã chuẩn hoá) -> _id

  // Nạp trước MaNV/SoHDLD đã có sẵn trong hệ thống (trước khi xử lý file).
  (DATA.DM_NHANVIEN||[]).forEach(e=>{ if(e.MaNV) empIdMap[normKey(e.MaNV)] = e._id; });
  (DATA.CT_QUATRINHLAMVIEC||[]).forEach(h=>{ if(h.SoHDLD) hdldIdMap[normKey(h.SoHDLD)] = h._id; });

  // Cấp 1: bảng gốc (danh mục + DM_NHANVIEN) — không có cha.
  Object.keys(dataByTable).forEach(t=>{
    const cfg = TABLES[t];
    if(!cfg || cfg.parent) return;
    out[t] = dataByTable[t].map(r=>{
      const row = {...r, _id: uid()};
      if(t==='DM_NHANVIEN' && row.MaNV) empIdMap[normKey(row.MaNV)] = row._id;
      return row;
    });
  });

  // Cấp 2: bảng con trực tiếp của Nhân viên — ghép qua cột "MaNV" (file này HOẶC đã có sẵn).
  Object.keys(dataByTable).forEach(t=>{
    const cfg = TABLES[t];
    if(!cfg || cfg.level!=='employee') return;
    const kept = [];
    dataByTable[t].forEach(r=>{
      const parentId = r.MaNV!==undefined ? empIdMap[normKey(r.MaNV)] : undefined;
      if(!parentId){ issues.push(`${t}: bỏ qua 1 dòng — không tìm thấy Mã NV "${r.MaNV||'(trống)'}" (kiểm tra đã tạo nhân viên này chưa, hoặc sheet DM_NHANVIEN trong file có đúng mã không).`); return; }
      const row = {...r, _id: uid(), _parentId: parentId};
      delete row.MaNV; // chỉ dùng để ghép nối, không phải cột dữ liệu thật
      resolveRefFieldsInRow(cfg, row, out);
      if(t==='CT_QUATRINHLAMVIEC' && r.SoHDLD) hdldIdMap[normKey(r.SoHDLD)] = row._id;
      kept.push(row);
    });
    out[t] = kept;
  });

  // Cấp 3: bảng con của Hợp đồng lao động — ghép qua cột "SoHDLD" (file này HOẶC đã có sẵn).
  Object.keys(dataByTable).forEach(t=>{
    const cfg = TABLES[t];
    if(!cfg || cfg.level!=='hdld') return;
    const kept = [];
    dataByTable[t].forEach(r=>{
      const parentId = r.SoHDLD!==undefined ? hdldIdMap[normKey(r.SoHDLD)] : undefined;
      if(!parentId){ issues.push(`${t}: bỏ qua 1 dòng — không tìm thấy Số HĐLĐ "${r.SoHDLD||'(trống)'}" (kiểm tra đã tạo hợp đồng này chưa — sheet CT_QUATRINHLAMVIEC = "Hợp đồng lao động", hoặc SoHDLD gõ có khớp chính xác với sheet đó không).`); return; }
      const row = {...r, _id: uid(), _parentId: parentId};
      delete row.SoHDLD; // chỉ dùng để ghép nối
      resolveRefFieldsInRow(cfg, row, out);
      kept.push(row);
    });
    out[t] = kept;
  });

  return {out, issues};
}

async function runImport(){
  if(!IMPORT_STATE.parsedData || Object.keys(IMPORT_STATE.parsedData).length===0){
    IMPORT_STATE.error = 'Chưa chọn file hoặc file không có dữ liệu hợp lệ.'; render(); return;
  }
  IMPORT_STATE.busy = true; IMPORT_STATE.error = null; render();
  try{
    const {out: resolved, issues} = resolveImportHierarchy(IMPORT_STATE.parsedData);
    // Cảnh báo (không chặn) các dòng bị thiếu mã tham chiếu bắt buộc — thường do gõ sai mã hoặc
    // danh mục liên quan chưa có trong hệ thống/chưa có trong file.
    const warnings = issues.slice();
    Object.keys(resolved).forEach(t=>{
      const cfg = TABLES[t];
      const requiredRefFields = (cfg.fields||[]).filter(f=>f.refTable && f.required);
      if(requiredRefFields.length===0) return;
      let missingCount = 0;
      resolved[t].forEach(row=>{
        if(requiredRefFields.some(f=>!row[f.key])) missingCount++;
      });
      if(missingCount>0) warnings.push(`${t}: ${missingCount} dòng thiếu mã tham chiếu bắt buộc (kiểm tra lại mã đã gõ, xem sheet DANH_MUC_MA)`);
    });
    const hasAnyRows = Object.values(resolved).some(rows=>rows.length>0);
    if(!hasAnyRows){
      IMPORT_STATE.busy = false;
      IMPORT_STATE.error = 'Không có dòng nào ghép nối được.' + (warnings.length? ' Chi tiết: ' + warnings.join(' | ') : '');
      render(); return;
    }
    const summary = await runServer('bulkImportData', resolved);
    await refreshData();
    importModalOpen = false;
    const summaryText = Object.entries(summary).map(([t,n])=>`${t}: +${n}`).join(', ');
    IMPORT_STATE = { busy:false, preview:null, error:null };
    if(warnings.length){
      showToast('⚠️ Đã nạp ' + (summaryText||'dữ liệu') + ' — nhưng có ' + warnings.length + ' cảnh báo, mở Console (F12) để xem chi tiết.');
      console.warn('[Import] Cảnh báo:', warnings);
    } else {
      showToast('✅ Đã nạp dữ liệu ban đầu' + (summaryText ? ' — ' + summaryText : '.'));
    }
  }catch(err){
    IMPORT_STATE.busy = false;
    IMPORT_STATE.error = err.message||String(err);
  }
  render();
}

/* =========================================================================
   MODAL (Add / Edit single-table form)
   ========================================================================= */
function renderFieldHtml(f, val, excludeRowId, rowData){
  if(f.type==='file'){
    const hasFile = val && String(val).trim().length>0;
    return `<div class="field">
      <label>${esc(f.label)} ${f.required?'<span class="req">*</span>':''}</label>
      ${hasFile ? `<div style="margin-bottom:6px;"><a href="${esc(val)}" target="_blank" rel="noopener" class="btn-link-text">📎 Xem file đã tải lên</a> <span style="color:var(--text-mute);font-size:12px;">(chọn file mới bên dưới nếu muốn thay)</span></div>` : ''}
      <input type="file" data-field="${f.key}" data-filefield="1" accept="image/*,.pdf">
      <input type="hidden" data-field="${f.key}-existing" value="${esc(val||'')}">
      ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}
    </div>`;
  }
  if(f.type==='multiselect'){
    const currentIds = String(val||'').split(',').map(s=>s.trim()).filter(Boolean);
    let rows = DATA[f.refTable]||[];
    let cascadeHint = '';
    let showGroupPrefix = false;
    if(f.cascadeFrom){
      const parentVal = rowData ? rowData[f.cascadeFrom] : '';
      const matchKey = f.cascadeMatch || f.cascadeFrom;
      if(!parentVal){
        // Chưa chọn field cha -> vẫn hiện ĐẦY ĐỦ lựa chọn (không để trống), kèm tiền tố nhóm để dễ chọn đúng.
        cascadeHint = 'Chưa chọn hình thức lương ở trên — đang hiện tất cả, chọn hình thức lương trước để danh sách gọn hơn.';
        showGroupPrefix = true;
      } else {
        rows = rows.filter(r => String(r[matchKey]||'')===String(parentVal));
      }
    }
    const opts = rows.map(r=>({v:r._id, l:(showGroupPrefix && r[f.cascadeMatch||f.cascadeFrom] ? '['+r[f.cascadeMatch||f.cascadeFrom]+'] ' : '') + (r[f.refLabel]||r._id)}));
    return `<div class="field">
      <label>${esc(f.label)} ${f.required?'<span class="req">*</span>':''}</label>
      <select multiple size="${Math.max(3, Math.min(6, opts.length||3))}" data-field="${f.key}" data-multiselect="1"
        ${f.cascadeFrom?`data-cascade-from="${f.cascadeFrom}" data-ref-table="${f.refTable}" data-ref-label="${f.refLabel}" data-cascade-match="${f.cascadeMatch||f.cascadeFrom}"`:''}>
        ${opts.length ? opts.map(o=>`<option value="${esc(o.v)}" ${currentIds.includes(String(o.v))?'selected':''}>${esc(o.l)}</option>`).join('') : `<option value="" disabled>— Chưa có dữ liệu trong danh mục ${esc(f.refTable)} —</option>`}
      </select>
      <div class="hint">${cascadeHint ? esc(cascadeHint)+' ' : ''}Giữ Ctrl (Cmd trên Mac) để chọn nhiều mã.${f.hint?' '+esc(f.hint):''}</div>
    </div>`;
  }
  if(f.type==='select'){
    let opts;
    if(f.refTable){
      opts = (DATA[f.refTable]||[]).filter(r=>!excludeRowId || r._id!==excludeRowId).map(r=>({v:r._id, l:r[f.refLabel]||r._id}));
    } else {
      opts = (f.options||[]).map(o=>({v:o,l:o}));
    }
    return `<div class="field">
      <label>${esc(f.label)} ${f.required?'<span class="req">*</span>':''}</label>
      <select data-field="${f.key}">
        <option value="">— Chọn —</option>
        ${opts.map(o=>`<option value="${esc(o.v)}" ${String(val)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')}
      </select>
      ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}
    </div>`;
  }
  if(f.type==='yesno'){
    const checked = val===true || val==='true' || val==='Yes' || val==='TRUE';
    return `<div class="field">
      <label>${esc(f.label)} ${f.required?'<span class="req">*</span>':''}</label>
      <div class="toggle-row">
        <label class="switch"><input type="checkbox" data-field="${f.key}" ${checked?'checked':''}><span class="slider"></span></label>
        <span style="font-size:13px;color:var(--text-mute);">${checked?'Có':'Không'}</span>
      </div>
    </div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field">
      <label>${esc(f.label)} ${f.required?'<span class="req">*</span>':''}</label>
      <textarea data-field="${f.key}">${esc(val)}</textarea>
      ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}
    </div>`;
  }
  const stepAttr = f.type==='number' ? ' step="any"' : '';
  return `<div class="field">
    <label>${esc(f.label)} ${f.required?'<span class="req">*</span>':''}</label>
    <input type="${f.type}" data-field="${f.key}" value="${esc(val===undefined||val===null?'':val)}"${stepAttr}>
    ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}
  </div>`;
}

  if(!isEdit && table==='CT_QUATRINHLAMVIEC' && !data.SoHDLD) data.SoHDLD = generateNextSoHDLD();

  const fieldsHtml = cfg.fields.filter(f=>!f.computed).map(f=> renderFieldHtml(f, data[f.key], row?row._id:null, data)).join('');

  let extraFieldsHtml = '';

      <input type="date" data-field="__NgayNghiViec">
      <div class="hint">${hasActiveContract
        ? 'Điền ngày này, bấm Lưu sẽ tự gửi kèm 1 bản nháp cập nhật "Ngày chấm dứt HĐLĐ" ở hợp đồng lao động đang hoạt động — không cần vào sửa hợp đồng riêng.'
        : 'Không tìm thấy hợp đồng lao động đang hoạt động (chưa có ngày chấm dứt) của nhân viên này — hãy tự vào tab Hợp đồng lao động để cập nhật.'}</div>

  return `<div class="overlay" data-action="close-modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">${isEdit?'Sửa':'Thêm'} ${cfg.label.toLowerCase()}</div>
        <button class="modal-close" data-action="close-modal">✕</button>
      </div>
      <div class="modal-body"><form id="entity-form">${fieldsHtml}${extraFieldsHtml}</form></div>
      <div class="modal-foot">
        <div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" data-action="close-modal">Hủy</button>
          <button class="btn btn-primary" data-action="save-row" data-table="${table}" ${isEdit?`data-id="${row._id}"`:''} ${parentId?`data-parentid="${parentId}"`:''}>💾 Lưu</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------------- WIZARD MODAL (Add employee, multi-step) ---------------- */
function renderWizardModal(){
  const step = modalState.step;
  const stepCfg = WIZARD_STEPS[step-1];
  const tableCfg = TABLES[stepCfg.table];
  const values = modalState.formData[stepCfg.key] || {};
  const isBaseStep = stepCfg.key==='base';

  let fieldsHtml;
  if(isBaseStep){
    const pbId = values.__MaPBId || '';
    const cvId = values.__MaCVId || '';
    const pbOpts = (DATA.DM_PHONGBAN||[]).map(r=>`<option value="${esc(r._id)}" ${pbId===r._id?'selected':''}>${esc(r.TenPB)}</option>`).join('');
    const cvOpts = (DATA.DM_CHUCVU||[]).map(r=>`<option value="${esc(r._id)}" ${cvId===r._id?'selected':''}>${esc(r.TenCV)}</option>`).join('');
    const pbRow = getRow('DM_PHONGBAN', pbId), cvRow = getRow('DM_CHUCVU', cvId);
    const autoMaNV = (pbRow && cvRow) ? generateNextMaNV(pbRow.MaPB, cvRow.MaCV) : '';
    const pbCvHtml = `
      <div class="field">
        <label>Phòng ban <span class="req">*</span></label>
        <select id="wiz-pb" data-field="__MaPBId">
          <option value="">— Chọn —</option>${pbOpts}
        </select>
      </div>
      <div class="field">
        <label>Chức vụ <span class="req">*</span></label>
        <select id="wiz-cv" data-field="__MaCVId">
          <option value="">— Chọn —</option>${cvOpts}
        </select>
      </div>
      <div class="field">
        <label>Mã nhân viên <span class="req">*</span></label>
        <input type="text" value="${esc(autoMaNV)}" data-field="MaNV" data-auto-manv="1" readonly
          style="background:#f3f4f6;color:var(--text-mute);cursor:not-allowed;">
        <div class="hint">Tự sinh theo cấu trúc "Mã phòng ban . Mã chức vụ . Số thứ tự" ngay khi bạn chọn đủ Phòng ban + Chức vụ ở trên.</div>
      </div>`;
    const restFields = tableCfg.fields.filter(f=>!f.computed && f.key!=='MaNV')
      .map(f=> renderFieldHtml(f, values[f.key], null, values)).join('');
    fieldsHtml = pbCvHtml + restFields;
  } else {
    if(stepCfg.table==='CT_QUATRINHLAMVIEC' && !values.SoHDLD) values.SoHDLD = generateNextSoHDLD();
    fieldsHtml = tableCfg.fields.filter(f=>!f.computed).map(f=> renderFieldHtml(f, values[f.key], null, values)).join('');
  }

  const dotsHtml = WIZARD_STEPS.map((s,i)=>{
    const n = i+1;
    const cls = n<step ? 'done' : (n===step ? 'current' : '');
    const lineCls = n<step ? 'done' : '';
    return `<div class="wiz-dot ${cls}">${n<step?'✓':n}</div>${i<WIZARD_STEPS.length-1?`<div class="wiz-line ${lineCls}"></div>`:''}`;
  }).join('');

  const isLast = step === WIZARD_STEPS.length;
  const canSkip = !stepCfg.required;

  return `<div class="overlay" data-action="close-wizard-overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">➕ Thêm nhân viên mới</div>
        <button class="modal-close" data-action="close-wizard">✕</button>
      </div>
      <div class="modal-body">
        <div class="wizard-progress">${dotsHtml}</div>
        <div class="wiz-step-title">${stepCfg.icon} Bước ${step}/${WIZARD_STEPS.length} — ${esc(stepCfg.title)} ${canSkip?'(không bắt buộc)':''}</div>
        <form id="wizard-form">${fieldsHtml}</form>
      </div>
      <div class="modal-foot">
        <div>${step>1?`<button class="btn btn-ghost" data-action="wizard-back">← Quay lại</button>`:''}</div>
        <div style="display:flex; gap:8px;">
          ${canSkip?`<button class="btn btn-ghost" data-action="wizard-skip">Bỏ qua</button>`:''}
          <button class="btn btn-primary" data-action="wizard-next">${isLast? '✅ Hoàn tất & Lưu' : 'Tiếp tục →'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* =========================================================================
   EVENT BINDING
   ========================================================================= */
function bindEvents(){
  document.body.onclick = async (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action==='go-home'){ nav = {view:'home'}; render(); return; }
    if(action==='go-reports'){ nav = {view:'reports', reportTab:'expiring'}; render(); return; }
    if(action==='go-pending'){ nav = {view:'pending'}; render(); return; }
    if(action==='go-guide'){ nav = {view:'guide'}; render(); return; }
    if(action==='go-nghiepvu'){ nav = {view:'nghiepvu'}; nghiepVuState = {step:'pick-action'}; render(); return; }
    if(action==='nghiepvu-pick-action'){ nghiepVuState = {step:'pick-employee', action: el.dataset.nvaction, search:''}; render(); return; }
    if(action==='nghiepvu-back'){ nghiepVuState = {step:'pick-action'}; render(); return; }
    if(action==='nghiepvu-pick-employee'){ openNghiepVuModal(nghiepVuState.action, el.dataset.id); render(); return; }
    if(action==='go-users'){
      nav = {view:'users'};
      render();
      await refreshUsers();
      render();
      return;
    }

    if(action==='add-user'){ userModalState = {row:null}; render(); return; }
    if(action==='edit-user'){
      const u = USER_LIST.find(x=>x._id===el.dataset.id);
      userModalState = {row:u};
      render(); return;
    }
    if(action==='delete-user'){
      if(!confirm('Xoá quyền truy cập của người dùng này?')) return;
      try{
        await runServer('deleteUserPermission', el.dataset.id);
        await refreshUsers();
        showToast('🗑️ Đã xoá người dùng.');
      }catch(err){ showToast('⚠️ Lỗi: ' + (err.message||err)); }
      render(); return;
    }
    if(action==='close-user-modal' || action==='close-user-modal-overlay'){
      if(action==='close-user-modal-overlay' && e.target !== el) return;
      userModalState = null; render(); return;
    }
    if(action==='save-user'){
      const form = document.getElementById('user-form');
      const row = userModalState.row ? {_id: userModalState.row._id} : {};
      ['Email','HoTen','VaiTro','TrangThai'].forEach(k=>{
        const fe = form.querySelector(`[data-field="${k}"]`);
        if(fe) row[k] = fe.value;
      });
      const choDuyetEl = form.querySelector('[data-field="ChoPhepDuyet"]');
      const choThaoTacEl = form.querySelector('[data-field="ChoPhepThaoTac"]');
      row.ChoPhepDuyet = choDuyetEl ? choDuyetEl.checked : false;
      row.ChoPhepThaoTac = choThaoTacEl ? choThaoTacEl.checked : false;
      if(!row.Email || !row.HoTen || !row.VaiTro){ showToast('⚠️ Vui lòng nhập đủ Email, Họ tên, Vai trò.'); return; }
      try{
        await runServer('saveUserPermission', row);
        userModalState = null;
        await refreshUsers();
        showToast('✅ Đã lưu quyền người dùng.');
      }catch(err){ showToast('⚠️ Lỗi: ' + (err.message||err)); }
      render(); return;
    }
    if(action==='approve-draft'){
      const table = el.dataset.table, id = el.dataset.id;
      try{
        await runServer('approveDraft', table, id);
        await refreshData();
        await refreshPendingCount();
        showToast('✅ Đã duyệt — đã cập nhật vào bản chính.');
      }catch(err){ showToast('⚠️ Lỗi khi duyệt: ' + (err.message||err)); }
      render(); return;
    }
    if(action==='reject-draft'){
      const table = el.dataset.table, id = el.dataset.id;
      if(!confirm('Từ chối bản nháp này? Sẽ không được đưa vào bản chính.')) return;
      try{
        await runServer('rejectDraft', table, id);
        await refreshPendingCount();
        showToast('❌ Đã từ chối bản nháp.');
      }catch(err){ showToast('⚠️ Lỗi: ' + (err.message||err)); }
      render(); return;
    }
    if(action==='set-report-tab'){ nav.reportTab = el.dataset.tab; render(); return; }
    if(action==='hc-filter'){
      const tu = document.getElementById('hc-tu'), den = document.getElementById('hc-den');
      HEADCOUNT_RANGE.tuNgay = tu ? tu.value : HEADCOUNT_RANGE.tuNgay;
      HEADCOUNT_RANGE.denNgay = den ? den.value : HEADCOUNT_RANGE.denNgay;
      render(); return;
    }
    if(action==='hc-print'){ window.print(); return; }
    if(action==='hc-export'){ exportHeadcountExcel(); return; }
    if(action==='eh-filter'){
      const empEl = document.getElementById('eh-emp'), tu = document.getElementById('eh-tu'), den = document.getElementById('eh-den');
      const empId = empEl ? empEl.value : '';
      if(!empId){ showToast('⚠️ Vui lòng chọn nhân viên.'); return; }
      EMP_HISTORY_STATE.empId = empId;
      EMP_HISTORY_STATE.tuNgay = tu ? tu.value : EMP_HISTORY_STATE.tuNgay;
      EMP_HISTORY_STATE.denNgay = den ? den.value : EMP_HISTORY_STATE.denNgay;
      EMP_HISTORY_STATE.loading = true; EMP_HISTORY_STATE.error = null; EMP_HISTORY_STATE.result = null;
      render();
      try{
        const result = await runServer('getEmployeeHistory', EMP_HISTORY_STATE.empId, EMP_HISTORY_STATE.tuNgay, EMP_HISTORY_STATE.denNgay);
        EMP_HISTORY_STATE.result = result;
      }catch(err){ EMP_HISTORY_STATE.error = (err && err.message) ? err.message : String(err); }
      EMP_HISTORY_STATE.loading = false;
      render(); return;
    }
    if(action==='eh-print'){ window.print(); return; }
    if(action==='eh-export'){ exportEmployeeHistoryExcel(); return; }
    if(action==='go-danhmuc'){ nav = {view:'danhmuc', table: el.dataset.table}; render(); return; }
    if(action==='go-employee'){ nav = {view:'employee', empId: el.dataset.id}; render(); return; }
    if(action==='go-hdld'){
      let empId = el.dataset.empid;
      if(!empId){ const hdld = getRow('CT_QUATRINHLAMVIEC', el.dataset.id); empId = hdld ? hdld._parentId : null; }
      nav = {view:'hdld', empId, hdldId: el.dataset.id}; render(); return;
    }
    if(action==='set-emp-tab'){ nav.tab = el.dataset.tab; render(); return; }
    if(action==='set-hdld-tab'){ nav.tab = el.dataset.tab; render(); return; }

    if(action==='go-drill'){
      const table = el.dataset.table, id = el.dataset.id;
      if(table==='CT_QUATRINHLAMVIEC'){
        // Lấy empId trực tiếp từ chính dòng dữ liệu (_parentId) thay vì tin vào nav.empId cũ —
        // tránh lỗi "Không tìm thấy hợp đồng" nếu state điều hướng trước đó bị lệch.
        const row = getRow('CT_QUATRINHLAMVIEC', id);
        nav = {view:'hdld', empId: row ? row._parentId : nav.empId, hdldId: id};
      }
      else if(table==='DM_TNCN'){ nav = {view:'tncnbac', tncnId: id}; }
      else if(table==='DM_LUONG'){ nav = {view:'luongbs', luongId: id}; }
      render(); return;
    }

    if(action==='add-employee'){
      modalState = {wizard:true, step:1, formData:{base:{}, personal:{}, contract:{}, assignment:{}}, skip:{personal:false, contract:false, assignment:false}};
      render(); return;
    }
    if(action==='wizard-next' || action==='wizard-skip'){
      const stepCfg = WIZARD_STEPS[modalState.step-1];
      if(action==='wizard-next'){
        const tableCfg = TABLES[stepCfg.table];
        const form = document.getElementById('wizard-form');
        const vals = {}; const missing = [];
        tableCfg.fields.filter(f=>!f.computed).forEach(f=>{
          const fe = form.querySelector(`[data-field="${f.key}"]`);
          const v = f.type==='yesno' ? fe.checked : fe.value;
          if(f.required && (v===''||v===undefined)) missing.push(f.label);
          vals[f.key] = v;
        });
        if(missing.length){ showToast('⚠️ Vui lòng nhập: ' + missing.join(', ')); return; }
        modalState.formData[stepCfg.key] = vals;
      } else {
        modalState.skip[stepCfg.key] = true;
      }
      if(modalState.step < WIZARD_STEPS.length){ modalState.step++; render(); }
      else { await finalizeWizard(); }
      return;
    }
    if(action==='wizard-back'){
      const stepCfg = WIZARD_STEPS[modalState.step-1];
      const tableCfg = TABLES[stepCfg.table];
      const form = document.getElementById('wizard-form');
      const vals = {};
      tableCfg.fields.filter(f=>!f.computed).forEach(f=>{
        const fe = form.querySelector(`[data-field="${f.key}"]`);
        vals[f.key] = f.type==='yesno' ? fe.checked : fe.value;
      });
      modalState.formData[stepCfg.key] = vals;
      modalState.step--; render(); return;
    }
    if(action==='close-wizard' || action==='close-wizard-overlay'){
      if(action==='close-wizard-overlay' && e.target !== el) return;
      modalState = null; render(); return;
    }

    if(action==='add-row'){ modalState = {table: el.dataset.table, parentId: el.dataset.parentid || null}; render(); return; }
    if(action==='edit-row'){
      const table = el.dataset.table, id = el.dataset.id;
      modalState = {table, row: getRow(table, id)};
      render(); return;
    }
    if(action==='delete-row'){
      const table = el.dataset.table, id = el.dataset.id;
      if(confirm('Gửi yêu cầu HỦY dòng này vào bản nháp — sau khi được duyệt, dòng sẽ được đánh dấu "Hủy" (không xoá vật lý, lịch sử vẫn được giữ lại đầy đủ). Tiếp tục?')){
        try{
          await runServer('saveDraftRow', table, {_id:id}, 'Xóa');
          await refreshPendingCount();
          showToast('📝 Đã gửi yêu cầu hủy vào bản nháp — chờ duyệt.');
        }catch(err){ showToast('⚠️ Lỗi: ' + (err.message||err)); }
        render();
      }
      return;
    }
    if(action==='close-modal' || action==='close-modal-overlay'){
      if(action==='close-modal-overlay' && e.target !== el) return;
      modalState = null; render(); return;
    }
    if(action==='save-row'){ await handleSave(el.dataset.table, el.dataset.id || null, el.dataset.parentid || null); return; }

    if(action==='seed-demo'){
      if((DATA.DM_NHANVIEN||[]).length>0){
        if(!confirm('Đã có dữ liệu nhân viên. Vẫn muốn thêm 1 nhân viên mẫu (sẽ thêm mới, không xóa dữ liệu cũ)?')) return;
      }
      try{
        await runServer('seedDemoEmployee');
        await refreshData();
        showToast('✅ Đã nạp nhân viên mẫu.');
      }catch(err){ showToast('⚠️ Lỗi: ' + (err.message||err)); }
      render(); return;
    }
    if(action==='export-csv'){ downloadCSV(el.dataset.table); return; }
    if(action==='export-excel-all'){ exportToExcel(); return; }
    if(action==='change-links'){ await changeLinks(); return; }

    if(action==='open-system-menu'){ systemMenuOpen = true; render(); return; }
    if(action==='close-system-menu' || action==='close-system-menu-overlay'){
      if(action==='close-system-menu-overlay' && e.target !== el) return;
      systemMenuOpen = false; render(); return;
    }
    if(action==='menu-run-initialize'){
      systemMenuOpen = false;
      await runInitialize();
      return;
    }
    if(action==='menu-download-template'){
      systemMenuOpen = false;
      downloadTemplate();
      return;
    }
    if(action==='menu-open-import'){
      systemMenuOpen = false;
      IMPORT_STATE = { busy:false, preview:null, error:null };
      importModalOpen = true;
      render(); return;
    }
    if(action==='close-import-modal' || action==='close-import-modal-overlay'){
      if(action==='close-import-modal-overlay' && e.target !== el) return;
      importModalOpen = false; render(); return;
    }
    if(action==='run-import'){ await runImport(); return; }
    if(action==='menu-change-links'){
      systemMenuOpen = false;
      await changeLinks();
      return;
    }
    if(action==='menu-fix-leading-zero'){
      systemMenuOpen = false;
      if(!confirm('Sửa định dạng các cột CCCD/SĐT/số tài khoản... sang dạng Văn bản để không bị rụng số 0 đầu nữa. Chỉ áp dụng cho các ô nhập TỪ NAY VỀ SAU — không tự khôi phục số 0 đã mất ở dữ liệu cũ. Tiếp tục?')) return;
      try{
        showToast('⏳ Đang sửa định dạng…');
        await runServer('fixLeadingZeroFormats');
        showToast('✅ Đã sửa xong định dạng. Dữ liệu cũ bị mất số 0 (nếu có) cần bạn kiểm tra và nhập lại tay.');
      }catch(err){ showToast('⚠️ Lỗi: ' + (err.message||err)); }
      return;
    }
    if(action==='menu-wipe-data'){
      systemMenuOpen = false;
      if(!confirm('⚠️ XOÁ SẠCH TOÀN BỘ DỮ LIỆU ở cả 2 Sheet chính (DM & Thông tin nhân sự) — chỉ giữ lại tiêu đề cột. Hành động này KHÔNG THỂ HOÀN TÁC. Bạn đã sao lưu (nếu cần) chưa? Bấm OK để tiếp tục.')) return;
      const typed = prompt('Để xác nhận lần cuối, gõ chính xác chữ  XOA HET  (không dấu, in hoa) rồi bấm OK:');
      if(typed !== 'XOA HET'){ showToast('Đã huỷ — không khớp từ xác nhận.'); return; }
      try{
        showToast('⏳ Đang xoá dữ liệu…');
        await runServer('wipeAllMainData');
        await refreshData();
        await refreshPendingCount();
        showToast('✅ Đã xoá sạch dữ liệu. Có thể vào "Khởi tạo / đồng bộ lại cấu trúc dữ liệu" để nạp lại danh mục gốc nếu cần.');
      }catch(err){ showToast('⚠️ Lỗi khi xoá dữ liệu: ' + (err.message||err)); }
      render();
      return;
    }
  };

  document.body.oninput = (e)=>{
    if(e.target.id==='emp-search'){
      // Chỉ cập nhật riêng danh sách nhân viên (#emp-list) thay vì render() lại toàn bộ app —
      // gõ tìm kiếm trước đây làm giật/chậm vì mỗi ký tự đều thay lại innerHTML của CẢ sidebar,
      // topbar và content, rồi phải khôi phục lại vị trí con trỏ trong ô input.
      searchTerm = e.target.value;
      const list = document.getElementById('emp-list');
      if(list) list.innerHTML = renderEmpListHtml();
      return;
    }
    if(e.target.id==='nv-emp-search'){
      nghiepVuState.search = e.target.value;
      const list = document.getElementById('nv-emp-list');
      if(list) list.innerHTML = renderNghiepVuEmpListHtml();
      return;
    }
  };
  document.body.onchange = (e)=>{
    if(e.target.id==='chk-inactive'){ showInactive = e.target.checked; render(); return; }
    if(e.target.id==='import-file-input'){ handleImportFileSelected(); return; }
    if(e.target.id==='user-role-select'){
      const fdDuyet = document.getElementById('field-choduyet');
      const fdThaoTac = document.getElementById('field-chothaotac');
      if(fdDuyet) fdDuyet.style.display = e.target.value==='Quản lý' ? 'block' : 'none';
      if(fdThaoTac) fdThaoTac.style.display = e.target.value==='Nhân viên' ? 'block' : 'none';
      return;
    }
    if(e.target.dataset && e.target.dataset.field==='TrangThai' && modalState && modalState.table==='DM_NHANVIEN'){
      const fdNgayNghiViec = document.getElementById('field-ngaynghiviec');
      if(fdNgayNghiViec) fdNgayNghiViec.style.display = e.target.value==='Đã nghỉ việc' ? 'block' : 'none';
      return;
    }
    if(e.target.dataset && e.target.dataset.field && e.target.type==='checkbox'){
      const span = e.target.closest('.toggle-row').querySelector('span:last-child');
      if(span) span.textContent = e.target.checked ? 'Có' : 'Không';
    }
    // Wizard "Thêm nhân viên" — bước cơ bản: đổi Phòng ban/Chức vụ -> tự tính lại Mã nhân viên.
    if(e.target.id==='wiz-pb' || e.target.id==='wiz-cv'){
      const form = e.target.closest('form');
      const maNVInput = form ? form.querySelector('[data-auto-manv="1"]') : null;
      if(maNVInput){
        const pbId = form.querySelector('#wiz-pb').value;
        const cvId = form.querySelector('#wiz-cv').value;
        const pbRow = getRow('DM_PHONGBAN', pbId), cvRow = getRow('DM_CHUCVU', cvId);
        maNVInput.value = (pbRow && cvRow) ? generateNextMaNV(pbRow.MaPB, cvRow.MaCV) : '';
      }
    }
    // Cascading: đổi field cha (VD Mã hình thức lương) -> lọc lại option của multiselect con (VD Mã lương)
    // trực tiếp trên DOM, không render() lại toàn form để không mất dữ liệu các field khác đang nhập dở.
    if(e.target.dataset && e.target.dataset.field){
      const form = e.target.closest('form');
      if(form){
        const cascadeEl = form.querySelector(`[data-cascade-from="${e.target.dataset.field}"]`);
        if(cascadeEl){
          const newVal = e.target.value;
          const refTable = cascadeEl.dataset.refTable, refLabel = cascadeEl.dataset.refLabel, matchKey = cascadeEl.dataset.cascadeMatch;
          const prevSelected = Array.from(cascadeEl.selectedOptions).map(o=>o.value);
          const rows = newVal ? (DATA[refTable]||[]).filter(r => String(r[matchKey]||'')===String(newVal)) : [];
          cascadeEl.innerHTML = rows.map(r=>`<option value="${esc(r._id)}" ${prevSelected.includes(r._id)?'selected':''}>${esc(r[refLabel]||r._id)}</option>`).join('');
        }
      }
    }
  };
}

async function handleSave(table, id, parentId){
  const cfg = TABLES[table];
  const form = document.getElementById('entity-form');

  // Xử lý riêng các field kiểu "file": có chọn file mới thì tải lên Drive trước, không thì giữ nguyên link cũ.
  const fileFields = cfg.fields.filter(f=>f.type==='file');
  const fileValues = {};
  for(const f of fileFields){
    const fileInput = form.querySelector(`[data-field="${f.key}"][data-filefield="1"]`);
    const existingInput = form.querySelector(`[data-field="${f.key}-existing"]`);
    if(fileInput && fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      if(file.size > 5*1024*1024){ showToast('⚠️ File "' + file.name + '" vượt quá 5MB.'); return; }
      showToast('⏳ Đang tải "' + file.name + '" lên Drive…');
      try{
        const uploaded = await uploadFileField(file);
        fileValues[f.key] = uploaded.url;
      }catch(err){ showToast('⚠️ Lỗi tải file lên: ' + (err.message||err)); return; }
    } else {
      fileValues[f.key] = existingInput ? existingInput.value : '';
    }
  }

  const newRow = {}; let missing = [];
  cfg.fields.filter(f=>!f.computed && f.type!=='file').forEach(f=>{
    const el = form.querySelector(`[data-field="${f.key}"]`);
    let val;
    if(f.type==='yesno') val = el.checked;
    else if(f.type==='multiselect') val = Array.from(el.selectedOptions).map(o=>o.value).join(',');
    else val = el.value;
    if(f.required && (val===''||val===undefined||val===null)) missing.push(f.label);
    newRow[f.key] = val;
  });
  fileFields.forEach(f=>{
    newRow[f.key] = fileValues[f.key];
    if(f.required && !fileValues[f.key]) missing.push(f.label);
  });
  if(missing.length){ showToast('⚠️ Vui lòng nhập: ' + missing.join(', ')); return; }

  // Ô "Ngày nghỉ việc" (chỉ có khi sửa DM_NHANVIEN) không phải field thật của bảng này — không đưa
  // vào newRow, mà dùng riêng bên dưới để tự gửi thêm 1 bản nháp cập nhật hợp đồng lao động.
  let ngayNghiViec = '';
  if(table==='DM_NHANVIEN'){
    const elNgayNghiViec = form.querySelector('[data-field="__NgayNghiViec"]');
    if(elNgayNghiViec) ngayNghiViec = elNgayNghiViec.value;
  }

  try{
    let row;
    if(id){
      row = {_id:id, ...newRow};
      if(cfg.parent){ const old = getRow(table,id); row._parentId = old ? old._parentId : parentId; }
    } else {
      row = {_id: uid(), ...newRow};
      if(cfg.parent) row._parentId = parentId;
    }

    if(table==='DM_CONG'){
      // Hồ sơ công ty: Admin sửa trực tiếp, không qua nháp (Admin là cấp cao nhất).
      await runServer('updateCompanyProfile', row);
      if(!DATA.DM_CONG) DATA.DM_CONG = [];
      const idx = DATA.DM_CONG.findIndex(r=>r._id===row._id);
      if(idx>-1) DATA.DM_CONG[idx] = row; else DATA.DM_CONG.push(row);
      modalState = null;
      showToast('✅ Đã cập nhật hồ sơ công ty.');
      render(); return;
    }

    await runServer('saveDraftRow', table, row, id ? 'Sửa' : 'Thêm');

    let contractSyncMsg = '';
    if(table==='DM_NHANVIEN' && newRow.TrangThai==='Đã nghỉ việc' && ngayNghiViec){
      const contract = rowsOf('CT_QUATRINHLAMVIEC', row._id).find(r=>!r.NgayChamDutHDLD);
      if(contract){
        try{
          await runServer('saveDraftRow', 'CT_QUATRINHLAMVIEC', {...contract, NgayChamDutHDLD: ngayNghiViec}, 'Sửa');
          contractSyncMsg = ' Đã tự gửi kèm bản nháp cập nhật Ngày chấm dứt HĐLĐ.';
        }catch(err){
          contractSyncMsg = ' ⚠️ Riêng việc tự cập nhật Ngày chấm dứt HĐLĐ bị lỗi (' + (err.message||err) + ') — vào tab Hợp đồng lao động để sửa tay.';
        }
      } else {
        contractSyncMsg = ' Lưu ý: không tìm thấy hợp đồng đang hoạt động nên chưa tự cập nhật được Ngày chấm dứt HĐLĐ — hãy vào tab Hợp đồng lao động để sửa tay.';
      }
    }

    modalState = null;
    await refreshPendingCount();
    showToast('📝 Đã gửi vào bản nháp — chờ duyệt để đưa vào bản chính.' + contractSyncMsg);
  }catch(err){
    showToast('⚠️ Lỗi khi gửi bản nháp: ' + (err.message||err));
  }
  render();
}

async function finalizeWizard(){
  try{
    const empId = uid();
    const baseRow = {_id: empId, ...modalState.formData.base};
    await runServer('saveDraftRow', 'DM_NHANVIEN', baseRow, 'Thêm');

    if(!modalState.skip.personal){
      const pRow = {_id: uid(), _parentId: empId, ...modalState.formData.personal};
      await runServer('saveDraftRow', 'CT_THONGTINCANHAN', pRow, 'Thêm');
    }
    if(!modalState.skip.contract){
      const cRow = {_id: uid(), _parentId: empId, ...modalState.formData.contract};
      await runServer('saveDraftRow', 'CT_QUATRINHLAMVIEC', cRow, 'Thêm');
    }
    const skippedAssignment = modalState.skip.assignment;
    if(!skippedAssignment){
      const aRow = {_id: uid(), _parentId: empId, ...modalState.formData.assignment};
      await runServer('saveDraftRow', 'CT_QUATRINHCONGTAC', aRow, 'Thêm');
    }
    modalState = null;
    nav = {view:'home'};
    await refreshPendingCount();
    showToast(skippedAssignment
      ? '📝 Đã gửi hồ sơ vào bản nháp — chờ duyệt. Lưu ý: chưa gán phòng ban/chức vụ, nhớ bổ sung sau (mục "Quá trình công tác") để lọc theo phòng ban hoạt động đúng.'
      : '📝 Đã gửi hồ sơ nhân viên vào bản nháp — chờ duyệt sẽ xuất hiện trong danh sách.');
  }catch(err){
    showToast('⚠️ Lỗi khi gửi bản nháp: ' + (err.message||err));
  }
  render();
}

   INIT
   ========================================================================= */
loadAll();

window.addEventListener('load', nudgeResize);

</script>
